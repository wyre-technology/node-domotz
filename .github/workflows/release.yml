name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get release info
        id: release_info
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            BODY=$(gh release view "$VERSION" --json body --jq '.body' 2>/dev/null || echo "")
            SUMMARY=$(echo "$BODY" | sed '1,2d' | head -30 | cut -c1-1800)
            {
              echo "summary<<RELEASE_EOF"
              echo "$SUMMARY"
              echo "RELEASE_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discord release notification
        if: steps.release_info.outputs.released == 'true'
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: "New Release: ${{ steps.release_info.outputs.version }}"
          description: |
            **${{ github.repository }}** — [${{ steps.release_info.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.release_info.outputs.version }})

            ${{ steps.release_info.outputs.summary }}
          color: 0x57F287
